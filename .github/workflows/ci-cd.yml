name: MindGraph CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
jobs:
  # 先阻断会导致运行时 NameError/解析失败的错误；全量 Ruff 债务按路线图逐步收紧。
  lint:
    name: Critical Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: |
          pip install ruff mypy==2.3.1

      - name: Ruff critical check
        run: ruff check src/ scripts/ tests/ --config pyproject.toml --select F821,F822,F823,E902

      - name: Mypy type check
        run: mypy src/ --ignore-missing-imports --no-strict-optional

  # ── Unit Tests ──
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run unit tests
        env:
          ENVIRONMENT: development
          AUTH_MODE: "off"
        run: |
          pytest tests/ -m "not slow" \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=55 \
            --junitxml=test-results.xml \
            -v

      - name: Validate Golden and candidate dataset contracts
        env:
          ENVIRONMENT: development
          AUTH_MODE: "off"
        run: |
          python -c "from evaluation.mindgraph_retrieval_eval import load_golden_dataset, load_candidate_dataset; assert len(load_golden_dataset()) >= 30; load_candidate_dataset()"

      - name: Run no-key offline demo smoke test
        if: matrix.python-version == '3.12'
        run: python scripts/validate_mindgraph_offline.py

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml

  # ── Web Client ──
  web:
    name: Web Typecheck, Test & Build
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web
        run: pnpm typecheck

      - name: Test web
        run: pnpm test

      - name: Build web
        run: pnpm build

  # ── Integration Tests ──
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run integration tests
        env:
          ENVIRONMENT: development
          AUTH_MODE: "off"
          CHAT_PROVIDER: "deepseek"
          OPENAI_COMPAT_BASE_URL: "https://test.example.com"
          OPENAI_COMPAT_API_KEY: "test-key"
          OPENAI_COMPAT_MODEL: "deepseek-test"
          RETRIEVAL_CANDIDATE_COUNT: "5"
          RETRIEVAL_FINAL_TOP_K: "3"
        run: pytest tests/ -m "integration" -v --no-cov

  # ── Docker Build ──
  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          tags: mindgraph-api:ci

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          load: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          tags: mindgraph-web:ci

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mindgraph-api:ci
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  # ── Security Scan ──
  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install bandit safety

      - name: Bandit security scan
        run: bandit -r src/ -c pyproject.toml -f json -o bandit-report.json

      - name: Safety dependency scan
        run: safety check --ignore=70612

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
