name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "1.8"

jobs:
  # ── Lint & Format ──
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: |
          pip install ruff mypy

      - name: Ruff check
        run: ruff check src/ tests/ --config pyproject.toml

      - name: Ruff format check
        run: ruff format --check src/ tests/ --config pyproject.toml

      - name: Mypy type check
        run: mypy src/ --ignore-missing-imports --no-strict-optional || true

  # ── Unit Tests ──
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run unit tests
        env:
          ENVIRONMENT: test
          AUTH_MODE: "off"
        run: |
          pytest tests/ -m "not slow" \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-results.xml \
            -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml

  # ── Integration Tests ──
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run integration tests
        env:
          ENVIRONMENT: test
          AUTH_MODE: "off"
          CHAT_PROVIDER: "deepseek"
          OPENAI_COMPAT_BASE_URL: "https://test.example.com"
          OPENAI_COMPAT_API_KEY: "test-key"
          OPENAI_COMPAT_MODEL: "deepseek-test"
          RETRIEVAL_CANDIDATE_COUNT: "5"
          RETRIEVAL_FINAL_TOP_K: "3"
        run: |
          pytest tests/ -m "integration" -v || echo "No integration tests marked (expected)"

  # ── Docker Build ──
  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: expense-rag-api:ci

      - name: Build Streamlit image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.streamlit
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: expense-rag-streamlit:ci

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: expense-rag-api:ci
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  # ── Security Scan ──
  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install bandit safety

      - name: Bandit security scan
        run: bandit -r src/ -c pyproject.toml -f json -o bandit-report.json || true

      - name: Safety dependency scan
        run: safety check --ignore=70612 || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
