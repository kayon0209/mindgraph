name: MindGraph CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13.15"
  UV_VERSION: "0.12.3"
jobs:
  # 先阻断会导致运行时 NameError/解析失败的错误；全量 Ruff 债务按路线图逐步收紧。
  lint:
    name: Critical Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned Python runtime
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Verify SQLite runtime before dependency install
        env:
          PYTHONPATH: src
        run: |
          PYTHON_BIN="$(uv python find ${{ env.PYTHON_VERSION }})"
          "$PYTHON_BIN" -c "import sqlite3; from infrastructure.sqlite_runtime import require_safe_sqlite_runtime; print(sqlite3.sqlite_version, require_safe_sqlite_runtime())"

      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev --python ${{ env.PYTHON_VERSION }}

      - name: Ruff critical check
        run: uv run --frozen --no-sync ruff check src/ scripts/ tests/ --config pyproject.toml --select F821,F822,F823,E902

      - name: Mypy type check
        run: uv run --frozen --no-sync mypy src/ --python-version 3.13 --ignore-missing-imports --no-strict-optional

  # ── Unit Tests ──
  test:
    name: Unit Tests (Python 3.13.15)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned Python runtime
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Verify SQLite runtime before dependency install
        env:
          PYTHONPATH: src
        run: |
          PYTHON_BIN="$(uv python find ${{ env.PYTHON_VERSION }})"
          "$PYTHON_BIN" -c "import sqlite3; from infrastructure.sqlite_runtime import require_safe_sqlite_runtime; print(sqlite3.sqlite_version, require_safe_sqlite_runtime())"

      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev --python ${{ env.PYTHON_VERSION }}

      - name: Run unit tests
        env:
          ENVIRONMENT: development
          AUTH_MODE: "off"
        run: |
          uv run --frozen --no-sync pytest tests/ -m "not slow" \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=55 \
            --junitxml=test-results.xml \
            -v

      - name: Validate Golden and candidate dataset contracts
        env:
          ENVIRONMENT: development
          AUTH_MODE: "off"
          # evaluation 模块经 src.retrieval 命名空间包间接导入 infrastructure/*，
          # 需要把 src/ 加入 PYTHONPATH（pytest 由 conftest 注入，此裸 python 步骤需显式声明）
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          uv run --frozen --no-sync python -c "from evaluation.mindgraph_retrieval_eval import load_golden_dataset, load_candidate_dataset; assert len(load_golden_dataset()) >= 30; load_candidate_dataset()"

      - name: Run no-key offline demo smoke test
        run: uv run --frozen --no-sync python scripts/validate_mindgraph_offline.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-3.13.15
          path: test-results.xml

  # ── Web Client ──
  web:
    name: Web Typecheck, Test & Build
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web
        run: pnpm typecheck

      - name: Test web
        run: pnpm test

      - name: Build web
        run: pnpm build

  # ── Integration Tests ──
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned Python runtime
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Verify SQLite runtime before dependency install
        env:
          PYTHONPATH: src
        run: |
          PYTHON_BIN="$(uv python find ${{ env.PYTHON_VERSION }})"
          "$PYTHON_BIN" -c "import sqlite3; from infrastructure.sqlite_runtime import require_safe_sqlite_runtime; print(sqlite3.sqlite_version, require_safe_sqlite_runtime())"

      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev --python ${{ env.PYTHON_VERSION }}

      - name: Run integration tests
        env:
          ENVIRONMENT: development
          AUTH_MODE: "off"
          CHAT_PROVIDER: "deepseek"
          OPENAI_COMPAT_BASE_URL: "https://test.example.com"
          OPENAI_COMPAT_API_KEY: "test-key"
          OPENAI_COMPAT_MODEL: "deepseek-test"
          RETRIEVAL_CANDIDATE_COUNT: "5"
          RETRIEVAL_FINAL_TOP_K: "3"
        run: uv run --frozen --no-sync pytest tests/ -m "integration" -v --no-cov

  # ── Docker Build ──
  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          tags: mindgraph-api:ci

      - name: Verify API image SQLite runtime
        run: docker run --rm --network none mindgraph-api:ci python -c "import sqlite3; from infrastructure.sqlite_runtime import require_safe_sqlite_runtime; print(sqlite3.sqlite_version, require_safe_sqlite_runtime())"

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          load: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          tags: mindgraph-web:ci

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mindgraph-api:ci
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  # ── Security Scan ──
  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned Python runtime
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Verify SQLite runtime before dependency install
        env:
          PYTHONPATH: src
        run: |
          PYTHON_BIN="$(uv python find ${{ env.PYTHON_VERSION }})"
          "$PYTHON_BIN" -c "import sqlite3; from infrastructure.sqlite_runtime import require_safe_sqlite_runtime; print(sqlite3.sqlite_version, require_safe_sqlite_runtime())"

      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev --python ${{ env.PYTHON_VERSION }}

      - name: Bandit security scan
        run: uv run --frozen --no-sync bandit -r src/ -c pyproject.toml -f json -o bandit-report.json

      - name: Safety dependency scan
        run: uv run --frozen --no-sync safety check --ignore=70612

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
