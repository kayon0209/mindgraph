  <rect width="32" height="32" rx="7" fill="#171916"/>
  <rect x="7.5" y="7.5" width="17" height="17" rx="4.5" fill="none" stroke="#e05a41" stroke-width="3"/>
  <path d="M11.8 16.4 l2.9 2.9 5.5-6.1" fill="none" stroke="#f6f2e9" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
