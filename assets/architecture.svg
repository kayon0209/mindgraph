<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 660" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="820" height="660" fill="#ffffff"/>
  <text x="40" y="38" font-size="21" font-weight="700" fill="#0f172a">MindGraph · 系统架构</text>
  <text x="40" y="60" font-size="13" fill="#64748b">混合检索 + 一跳图谱扩展 + 本地优先嵌入的可溯源问答</text>

  <!-- Obsidian Vault -->
  <rect x="40" y="84" width="340" height="60" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="60" y="112" font-size="15" font-weight="600" fill="#5b21b6">Obsidian Vault</text>
  <text x="60" y="132" font-size="12" fill="#6d28d9">用户笔记（本地数据，不上传）</text>

  <line x1="210" y1="144" x2="210" y2="176" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="225" y="166" font-size="11" fill="#475569">扫描 + 注入稳定 ID</text>

  <!-- VaultSyncService -->
  <rect x="40" y="180" width="340" height="60" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="208" font-size="15" font-weight="600" fill="#1e3a8a">VaultSyncService</text>
  <text x="60" y="228" font-size="12" fill="#1e40af">扫描 / 剪枝 / 稳定 Frontmatter ID 注入</text>

  <line x1="210" y1="240" x2="210" y2="272" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- MindGraphIndexService -->
  <rect x="40" y="276" width="340" height="64" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="60" y="304" font-size="15" font-weight="600" fill="#065f46">MindGraphIndexService</text>
  <text x="60" y="324" font-size="12" fill="#047857">FAISS(BGE) + BM25 + RRF 增量索引</text>

  <line x1="210" y1="340" x2="210" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- RetrievalPipeline -->
  <rect x="40" y="376" width="340" height="64" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="60" y="404" font-size="15" font-weight="600" fill="#9a3412">MindGraphRetrievalPipeline</text>
  <text x="60" y="424" font-size="12" fill="#c2410c">hybrid 检索 + 一跳图谱扩展</text>

  <line x1="210" y1="440" x2="210" y2="472" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- LLM -->
  <rect x="40" y="476" width="340" height="58" rx="12" fill="#0f172a"/>
  <text x="60" y="504" font-size="15" font-weight="600" fill="#ffffff">LLM 生成（带 [citation] 溯源）</text>
  <text x="60" y="524" font-size="12" fill="#cbd5e1">OpenAI-compatible · 可降级</text>

  <!-- GraphStore (right) -->
  <rect x="470" y="376" width="310" height="120" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="490" y="404" font-size="15" font-weight="700" fill="#5b21b6">GraphStore / RelationStore</text>
  <text x="490" y="428" font-size="12" fill="#6d28d9">SQLite note_relations</text>
  <text x="490" y="450" font-size="12" fill="#6d28d9">proposed / confirmed / conflict</text>
  <text x="490" y="472" font-size="11" fill="#6d28d9">一跳扩展补充证据上下文</text>

  <path d="M380 408 C 430 408 430 408 470 416" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#c)"/>

  <!-- Frontends -->
  <rect x="40" y="560" width="340" height="58" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="60" y="588" font-size="15" font-weight="600" fill="#075985">前端 ① Obsidian 插件</text>
  <text x="60" y="608" font-size="12" fill="#0369a1">右侧栏问答 + 插入笔记</text>

  <rect x="440" y="560" width="340" height="58" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="460" y="588" font-size="15" font-weight="600" fill="#075985">前端 ② Web Demo</text>
  <text x="460" y="608" font-size="12" fill="#0369a1">React + Vite（4 页）</text>

  <line x1="120" y1="534" x2="120" y2="560" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="610" y1="534" x2="610" y2="560" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/></marker>
  </defs>
</svg>
